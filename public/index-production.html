<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape the Jungle Mini Golf</title>
    <meta name="description" content="Play Escape the Jungle Mini Golf - A 3D browser-based golf game with realistic physics!">
    <meta name="keywords" content="mini golf, 3D game, browser game, golf game, jungle">
    
    <!-- Optional: Add your website's analytics -->
    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=YOUR-ID"></script> -->
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10000;
        }
        
        #loading h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        #loading .spinner {
            border: 4px solid #333;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #error {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            color: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 10001;
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading">
        <h1>🌴 Escape the Jungle Mini Golf 🌴</h1>
        <div class="spinner"></div>
        <p style="margin-top: 20px;">Loading game...</p>
    </div>
    
    <!-- Error screen -->
    <div id="error">
        <h2>⚠️ Error Loading Game</h2>
        <p id="error-message"></p>
        <button onclick="location.reload()" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">
            Retry
        </button>
    </div>

    <!-- Load THREE.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
    
    <!-- Load game code -->
    <script>
        // Version tracker for cache busting
        const GAME_VERSION = '4.4';
        
        // Hide loading screen when game loads
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loading = document.getElementById('loading');
                if (loading) {
                    loading.style.display = 'none';
                }
            }, 1000);
        });
        
        // Error handling
        window.addEventListener('error', function(e) {
            console.error('Game error:', e);
            const errorDiv = document.getElementById('error');
            const errorMsg = document.getElementById('error-message');
            if (errorDiv && errorMsg) {
                errorMsg.textContent = 'Failed to load game. Please refresh the page.';
                errorDiv.style.display = 'block';
            }
        });
        
        // Check if THREE.js loaded
        if (typeof THREE === 'undefined') {
            setTimeout(function() {
                const errorDiv = document.getElementById('error');
                const errorMsg = document.getElementById('error-message');
                if (errorDiv && errorMsg) {
                    errorMsg.textContent = 'THREE.js library failed to load. Check your internet connection.';
                    errorDiv.style.display = 'block';
                }
            }, 3000);
        }
    </script>
    
    <!-- Main game script - add version for cache busting -->
    <script src="game-simple.js?v=4.4"></script>
    
    <!-- Optional: Add footer or links back to your site -->
    <!--
    <div style="position: fixed; bottom: 10px; right: 10px; color: white; font-size: 12px; z-index: 1000;">
        <a href="https://yourwebsite.com" style="color: white; text-decoration: none;">← Back to YourSite.com</a>
    </div>
    -->
</body>
</html>
