<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape the Jungle Mini Golf</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        
        canvas {
            display: block;
            cursor: crosshair;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .game-title {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <div class="game-title">Escape the Jungle Mini Golf</div>
        <div class="loading" id="loading">Loading Three.js...</div>
    </div>
    
    <!-- Load Three.js from CDN -->
    <script src="https://unpkg.com/three@0.130.0/build/three.min.js"></script>
    
    <!-- Load our game -->
    <script>
        // Wait for THREE.js to load, then load our game
        const loadGame = () => {
            if (typeof THREE !== 'undefined') {
                console.log('THREE.js loaded, loading game...');
                const script = document.createElement('script');
                script.src = 'game-simple.js?v=4.2'; // Version 4.2 - Collision & Cleanup Fixes
                script.onload = () => {
                    console.log('Game script loaded successfully');
                    document.getElementById('loading').style.display = 'none';
                };
                script.onerror = () => {
                    console.error('Failed to load game script');
                    document.getElementById('loading').innerHTML = 'Failed to load game. Check console for errors.';
                };
                document.head.appendChild(script);
            } else {
                setTimeout(loadGame, 100);
            }
        };
        loadGame();
    </script>
</body>
</html>
